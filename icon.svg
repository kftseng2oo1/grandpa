<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="0.55" stop-color="#f4a259"/>
      <stop offset="1" stop-color="#d9692a"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f3e6cc"/>
    </linearGradient>
    <path id="star" d="M0,-1 C0.12,-0.12 0.12,-0.12 1,0 C0.12,0.12 0.12,0.12 0,1 C-0.12,0.12 -0.12,0.12 -1,0 C-0.12,-0.12 -0.12,-0.12 0,-1Z"/>
  </defs>

  <!-- 暖燈背景 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="210" r="190" fill="#fff3d6" opacity="0.18"/>

  <!-- 故事星星 -->
  <g fill="#fffbe8">
    <use href="#star" transform="translate(98 112) scale(24)"/>
    <use href="#star" transform="translate(418 96) scale(30)"/>
    <use href="#star" transform="translate(440 214) scale(14)"/>
    <use href="#star" transform="translate(76 230) scale(12)"/>
  </g>

  <!-- 身體（毛背心） -->
  <path d="M86,512 C96,382 168,330 256,330 C344,330 416,382 426,512 Z" fill="#7a4a22"/>
  <path d="M256,330 L226,400 L256,512 L286,400 Z" fill="#fffaf0" opacity="0.9"/>

  <!-- 耳朵 -->
  <circle cx="146" cy="214" r="24" fill="#eebb8c" stroke="#d99a68" stroke-width="5"/>
  <circle cx="366" cy="214" r="24" fill="#eebb8c" stroke="#d99a68" stroke-width="5"/>

  <!-- 臉 -->
  <circle cx="256" cy="206" r="112" fill="#f6d2a8" stroke="#d99a68" stroke-width="5"/>
  <ellipse cx="226" cy="128" rx="34" ry="16" fill="#fff" opacity="0.45" transform="rotate(-18 226 128)"/>

  <!-- 兩側白髮 -->
  <g fill="#fbf7ef" stroke="#e3dccd" stroke-width="3">
    <path d="M150,196 C126,186 122,158 140,146 C140,128 162,118 176,130 C188,120 206,130 200,146 C186,150 170,170 166,196 Z"/>
    <path d="M362,196 C386,186 390,158 372,146 C372,128 350,118 336,130 C324,120 306,130 312,146 C326,150 342,170 346,196 Z"/>
  </g>

  <!-- 白眉毛 -->
  <g stroke="#fbf7ef" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M186,160 Q212,144 238,156"/>
    <path d="M274,156 Q300,144 326,160"/>
  </g>

  <!-- 腮紅 -->
  <ellipse cx="184" cy="246" rx="22" ry="14" fill="#f08c74" opacity="0.5"/>
  <ellipse cx="328" cy="246" rx="22" ry="14" fill="#f08c74" opacity="0.5"/>

  <!-- 老花眼鏡 + 瞇瞇笑眼 -->
  <g fill="none" stroke-linecap="round">
    <path d="M200,204 Q213,191 226,204" stroke="#3b2614" stroke-width="6"/>
    <path d="M286,204 Q299,191 312,204" stroke="#3b2614" stroke-width="6"/>
    <circle cx="213" cy="200" r="32" fill="#ffffff" fill-opacity="0.22" stroke="#5a3418" stroke-width="8"/>
    <circle cx="299" cy="200" r="32" fill="#ffffff" fill-opacity="0.22" stroke="#5a3418" stroke-width="8"/>
    <path d="M245,198 Q256,190 267,198" stroke="#5a3418" stroke-width="7"/>
  </g>

  <!-- 鼻子 -->
  <ellipse cx="256" cy="236" rx="15" ry="13" fill="#e9ad7f"/>

  <!-- 正在說話的嘴 -->
  <path d="M236,268 Q256,306 276,268 Z" fill="#9b3b2b"/><path d="M246,288 Q256,298 266,288 Q256,282 246,288Z" fill="#e8786a"/>
  <!-- 白鬍子 -->
  <path d="M256,252 C240,244 214,248 204,264 C216,276 240,274 256,262 C272,274 296,276 308,264 C298,248 272,244 256,252 Z" fill="#fbf7ef" stroke="#e3dccd" stroke-width="3"/>

  <!-- 打開的故事書 -->
  <path d="M256,332 C214,312 156,310 98,322 L98,452 C156,440 214,442 256,462 C298,442 356,440 414,452 L414,322 C356,310 298,312 256,332 Z" fill="#a0522d" transform="translate(0 12)"/>
  <path d="M256,326 C216,306 160,304 108,314 L108,440 C160,430 216,432 256,452 Z" fill="url(#page)" stroke="#c49a6c" stroke-width="3"/>
  <path d="M256,326 C296,306 352,304 404,314 L404,440 C352,430 296,432 256,452 Z" fill="url(#page)" stroke="#c49a6c" stroke-width="3"/>
  <path d="M256,326 L256,452" stroke="#c49a6c" stroke-width="4"/>
  <g stroke="#dcc6a2" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M136,346 Q186,338 232,352"/>
    <path d="M136,372 Q186,364 232,378"/>
    <path d="M136,398 Q176,392 210,400"/>
    <path d="M280,352 Q326,338 376,346"/>
    <path d="M280,378 Q326,364 376,372"/>
  </g>
  <!-- 小愛心 -->
  <path d="M190,420 c-6,-10 -20,-6 -18,4 c2,8 18,16 18,16 c0,0 16,-8 18,-16 c2,-10 -12,-14 -18,-4z" fill="#e05a4f" transform="translate(152 -18)"/>

  <!-- 握書的手 -->
  <ellipse cx="108" cy="384" rx="20" ry="28" fill="#f2c497" stroke="#d99a68" stroke-width="4"/>
  <ellipse cx="404" cy="384" rx="20" ry="28" fill="#f2c497" stroke="#d99a68" stroke-width="4"/>
</svg>
