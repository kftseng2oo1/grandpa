<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="阿公說故事">
<meta name="theme-color" content="#7a4a22">
<title>阿公說故事</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --bg:#fbf4e6;--paper:#fffaf0;--ink:#3b2614;--soft:#7a5a3c;--brown:#7a4a22;
  --orange:#e07a2e;--orange2:#f4a259;--red:#d64541;--green:#3f8f5a;--line:#ead9bd;
  --shadow:0 3px 10px rgba(90,55,20,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:20px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;border-radius:16px}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:5;background:var(--brown);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;font-size:24px;font-weight:700;letter-spacing:2px;text-align:center}
header.top small{display:block;font-size:15px;font-weight:400;opacity:.85;letter-spacing:0}
main{padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
h2{font-size:22px;margin:8px 0 12px;color:var(--brown)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px 12px;text-align:center;box-shadow:var(--shadow);min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card .em{font-size:46px;line-height:1.1}
.card .tt{font-size:21px;font-weight:700;margin-top:6px}
.card .sub{font-size:14px;color:var(--soft)}
.card.free{background:#fff3e3;border-color:var(--orange2)}
.card.mine{border-color:#c9dcc2;background:#f6fbf2}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#fff;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border-radius:0;padding:8px 0 10px;font-size:15px;color:var(--soft)}
nav.tabs button b{display:block;font-size:28px;line-height:1.2}
nav.tabs button.on{color:var(--brown);font-weight:700;background:#fdf0dc}
.btn{display:block;width:100%;padding:16px;font-size:22px;font-weight:700;background:var(--orange);color:#fff;box-shadow:var(--shadow)}
.btn.sec{background:#efe2cc;color:var(--ink)}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.5}
label.f{display:block;font-weight:700;margin:16px 0 6px;color:var(--brown)}
input[type=text],input[type=number],input[type=url],textarea,select{width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:20px}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;background:#fff;border:2px solid var(--line);border-radius:999px;font-size:18px}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff}
.hint{font-size:15px;color:var(--soft);margin-top:6px}

/* 讀故事畫面 */
#v-read{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column}
.rhead{display:flex;align-items:center;gap:8px;background:var(--brown);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
.rhead button{background:rgba(255,255,255,.18);color:#fff;padding:10px 14px;font-size:18px}
.rhead .rt{flex:1;text-align:center;font-size:21px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.recbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff3e3;border-bottom:2px solid var(--line)}
#recBtn{flex:1;white-space:nowrap;padding:14px;font-size:22px;font-weight:700;background:var(--red);color:#fff}
#recBtn.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(214,69,65,.6)}50%{box-shadow:0 0 0 10px rgba(214,69,65,0)}}
#recTime{min-width:76px;text-align:center;font-size:22px;font-variant-numeric:tabular-nums;color:var(--red);font-weight:700}
#ttsBtn{background:#efe2cc;padding:14px 12px;font-size:20px}
.pwrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 20px}
#paraBox{font-size:30px;line-height:1.75;letter-spacing:1px;white-space:pre-wrap}
#paraBox textarea{font-size:inherit;min-height:50vh;line-height:1.6}
#paraNum{text-align:center;color:var(--soft);font-size:17px;padding:4px 0}
.pnav{display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--line)}
.pnav button{flex:1;padding:18px 0;font-size:24px;font-weight:700;background:#efe2cc}
.pnav button.next{background:var(--orange);color:#fff;flex:1.4}
#savePanel,#voicePanel{position:fixed;inset:0;z-index:30;background:rgba(40,25,10,.55);display:flex;align-items:flex-end}
#savePanel .sheet,#voicePanel .sheet{max-height:92vh;overflow-y:auto;width:100%;background:var(--paper);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
#savePanel .row,#voicePanel .row{display:flex;gap:10px;margin-top:14px}
#savePanel .row button,#voicePanel .row button{flex:1}
#aiVoiceBtn{background:#3f6f8f;color:#fff;padding:14px 10px;font-size:17px;font-weight:700;white-space:nowrap}
.vbox{background:#f1f6fa;border:2px solid #c6d8e6;border-radius:20px;padding:16px;margin-top:26px}
.vbox h2{color:#3f6f8f;margin:0 0 4px}
.vstat{font-size:18px;margin:4px 0 14px}
.vscript{font-size:24px;line-height:1.7;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
#vRec{background:var(--red)}#vRec.on{animation:pulse 1.2s infinite}
#vTime{min-width:80px;text-align:center;font-size:22px;font-weight:700;color:var(--red);align-self:center;flex:0!important}
.tag{display:inline-block;font-size:13px;font-weight:700;background:#3f6f8f;color:#fff;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:3px}

/* 錄音清單 */
.rec{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.rec .h{display:flex;align-items:center;gap:10px}
.rec .h .em{font-size:40px}
.rec .h .t{flex:1;font-size:21px;font-weight:700;line-height:1.35}
.rec .h .t small{display:block;font-size:15px;font-weight:400;color:var(--soft)}
.rec .acts{display:flex;gap:8px;margin-top:12px}
.rec .acts button{padding:14px 10px;font-size:19px;font-weight:700}
.rec .play{flex:2;background:var(--green);color:#fff}
.rec .play.on{background:var(--orange)}
.rec .share{flex:1.3;background:#06c755;color:#fff}
.rec .del{flex:.8;background:#efe2cc}
.rec .del.warn{background:var(--red);color:#fff;flex:1.6;font-size:16px}
.empty{text-align:center;color:var(--soft);padding:40px 10px}
.empty .em{font-size:60px}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(50,30,10,.92);color:#fff;padding:14px 22px;border-radius:999px;font-size:19px;z-index:50;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
.loading{text-align:center;padding:26px;font-size:20px;color:var(--brown)}
.loading .em{font-size:50px;display:inline-block;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.rng{display:flex;align-items:center;gap:12px}
.rng input{flex:1}
.preview{background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:12px;margin-top:10px}
</style>
</head>
<body>

<header class="top"><img src="icon.svg" alt="" style="width:34px;height:34px;border-radius:9px;vertical-align:-7px;margin-right:6px">阿公說故事<small id="subTitle">講給乖孫聽</small></header>

<main>
  <!-- 故事書 -->
  <section id="v-lib">
    <h2>挑一個故事來講</h2>
    <div class="grid" id="libGrid"></div>
  </section>

  <!-- 編新故事 -->
  <section id="v-ai" class="hidden">
    <h2>✨ 幫阿公編新故事</h2>
    <label class="f">想講什麼？（可以選好幾個）</label>
    <div class="chips" id="themeChips"></div>
    <label class="f">還有什麼要加的？（可以不填）</label>
    <textarea id="aiExtra" placeholder="例如：今天他不肯刷牙、明天要第一次上幼稚園、我們家的狗叫小黑…"></textarea>
    <label class="f">故事長度</label>
    <select id="aiLen">
      <option value="5">短短的（大約 2 分鐘）</option>
      <option value="8" selected>剛剛好（大約 4 分鐘）</option>
      <option value="12">長一點（睡前慢慢講）</option>
    </select>
    <div style="height:18px"></div>
    <button class="btn" id="aiGo">✨ 編一個故事</button>
    <div id="aiOut"></div>
  </section>

  <!-- 錄音 -->
  <section id="v-rec" class="hidden">
    <h2>🎧 阿公錄好的故事</h2>
    <div id="recList"></div>
  </section>

  <!-- 設定 -->
  <section id="v-set" class="hidden">
    <h2>⚙️ 設定</h2>
    <label class="f">孫子怎麼叫？</label>
    <input type="text" id="setName" placeholder="例如：小寶、阿弟、乖孫">
    <div class="hint">故事裡會用這個名字叫他</div>
    <label class="f">孫子幾歲？</label>
    <input type="number" id="setAge" min="1" max="15" inputmode="numeric">
    <label class="f">故事字的大小</label>
    <div class="rng"><span>小</span><input type="range" id="setFont" min="22" max="48" step="2"><span style="font-size:30px">大</span></div>
    <div class="preview" id="fontPrev">從前從前，森林裡有一隻兔子…</div>
    <label class="f">AI 編故事網址</label>
    <input type="url" id="setApi" autocapitalize="off" autocorrect="off">
    <div class="hint">送出 Anthropic messages 格式（model / max_tokens / messages）</div>
    <div style="height:18px"></div>
    <label class="f">🤖 聲音服務網址</label>
    <input type="url" id="setVoiceApi" autocapitalize="off" autocorrect="off">
    <label class="f">🤖 聲音通行碼（arcar 沒設就留空）</label>
    <input type="text" id="setVoiceToken" autocapitalize="off" autocorrect="off">
    <div style="height:18px"></div>
    <button class="btn green" id="setSave">儲存設定</button>
    <div class="vbox">
      <h2>🤖 阿公的 AI 聲音</h2>
      <div class="vstat" id="vStat"></div>
      <button class="btn" id="vSetup" style="background:#3f6f8f">🎙️ 錄聲音樣本</button>
      <button class="btn hidden" id="vTest2" style="background:var(--green);margin-top:10px">🔊 聽 AI 阿公說話</button>
      <button class="btn sec hidden" id="vDel" style="margin-top:10px">刪除 AI 聲音</button>
      <div class="hint">AI 會模仿阿公的聲音念新故事，念出來的錄音會標上 🤖，讓孩子知道哪些是阿公親口講的。樣本會上傳到阿里雲做聲音複製，請先取得阿公同意。</div>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="lib" class="on"><b>📖</b>故事書</button>
  <button data-tab="ai"><b>✨</b>編新故事</button>
  <button data-tab="rec"><b>🎧</b>錄好的</button>
  <button data-tab="set"><b>⚙️</b>設定</button>
</nav>

<!-- 講故事畫面 -->
<div id="v-read" class="hidden">
  <div class="rhead">
    <button id="rBack">← 回去</button>
    <div class="rt" id="rTitle"></div>
    <button id="rDel" class="hidden">刪除</button>
  </div>
  <div class="recbar">
    <button id="recBtn">🎙️ 錄音</button>
    <div id="recTime">00:00</div>
    <button id="ttsBtn" title="念這段">🔊</button>
    <button id="aiVoiceBtn" class="hidden">🤖 整篇</button>
  </div>
  <div class="pwrap" id="pwrap"><div id="paraBox"></div></div>
  <div id="paraNum"></div>
  <div class="pnav">
    <button id="pPrev">◀ 上一段</button>
    <button id="pNext" class="next">下一段 ▶</button>
  </div>
</div>

<div id="savePanel" class="hidden">
  <div class="sheet">
    <h2 style="margin-top:0">🎉 講完了！要存起來嗎？</h2>
    <label class="f" style="margin-top:4px">這段錄音叫什麼？</label>
    <input type="text" id="saveTitle">
    <div class="hint" id="saveInfo"></div>
    <div class="row">
      <button class="btn sec" id="saveNo">不要，重講</button>
      <button class="btn green" id="saveYes">存起來</button>
    </div>
  </div>
</div>

<div id="voicePanel" class="hidden">
  <div class="sheet">
    <h2 style="margin-top:0">🎙️ 錄阿公的聲音樣本</h2>
    <div class="hint" style="font-size:17px">找安靜的地方，手機拿近一點，用平常講故事的語氣念下面這段（大約 15～20 秒）。</div>
    <div class="vscript" id="vScript"></div>
    <div class="row"><button class="btn" id="vRec">🎙️ 開始錄</button><div id="vTime">00:00</div></div>
    <div id="vAfter" class="hidden"><div class="row"><button class="btn sec" id="vPlay">▶️ 聽聽看</button><button class="btn green" id="vUpload">✓ 就用這段</button></div></div>
    <div class="hint" id="vMsg" style="font-size:18px;margin-top:12px"></div>
    <button class="btn hidden" id="vTest" style="background:#3f6f8f;margin-top:12px">🔊 聽 AI 阿公說話</button>
    <button class="btn sec" id="vClose" style="margin-top:14px">關閉</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

/* ========== 內建故事（{name} 會換成孫子名字） ========== */
var STORIES = [
 {id:'s1',emoji:'🐢',title:'龜兔賽跑',paras:[
  '{name}，阿公今天來講一個賽跑的故事喔。',
  '從前從前，森林裡有一隻兔子，跑得非常快。牠最喜歡笑烏龜：「你走路慢吞吞，好像在散步！」',
  '烏龜沒有生氣，慢慢地說：「那我們來比賽，看誰先跑到山頂那棵大榕樹。」',
  '比賽一開始，兔子咻——一下就不見了。牠回頭一看，烏龜還在起點附近，就想：「我先睡個午覺好了。」',
  '烏龜呢？一步、一步、一步，都沒有停下來。太陽好大，牠擦擦汗，繼續走。',
  '等兔子睡醒，揉揉眼睛——哎呀！烏龜已經快到大榕樹了！兔子拚命追，可是來不及了。',
  '{name}你看，跑得快不一定會贏。認真、不放棄的人，才會走到終點喔。'
 ]},
 {id:'s2',emoji:'🐺',title:'狼來了',paras:[
  '{name}，這個故事是講一個很愛開玩笑的放羊小孩。',
  '山坡上有一個小男孩，每天在顧羊。他覺得好無聊，就大喊：「狼來了！狼來了！」',
  '村子裡的大人聽到，拿著鋤頭、扁擔趕快跑上山。結果哪有狼？小男孩笑得在地上滾來滾去。',
  '過了幾天，他又喊一次。大人們又氣喘吁吁跑上來，又被騙了，大家都很生氣地下山。',
  '有一天，狼真的來了！小男孩嚇得大叫：「狼來了！這次是真的啦！」',
  '可是村子裡的人說：「又在騙人了。」沒有一個人上山，羊都被狼趕跑了。',
  '所以{name}要記得，說話要誠實，大家才會相信你喔。'
 ]},
 {id:'s3',emoji:'🍐',title:'孔融讓梨',paras:[
  '{name}，阿公講一個很久很久以前的小朋友，他叫孔融，跟你差不多大。',
  '有一天，有人送來一盤梨子，又香又甜。爸爸說：「孔融，你先拿。」',
  '孔融看了看，挑了最小的一顆。爸爸好奇問他：「大的不是比較好吃嗎？」',
  '孔融說：「哥哥比我大，應該吃大的；弟弟比我小，我要照顧他，也給他大的。」',
  '爸爸聽了好高興，摸摸他的頭說：「你真是個懂事的好孩子。」',
  '{name}，有好吃的東西，記得先想到家裡的人，大家都會很喜歡你喔。'
 ]},
 {id:'s4',emoji:'🏺',title:'司馬光砸缸',paras:[
  '{name}，這個故事的小主角叫司馬光，他很冷靜、很聰明。',
  '有一天，司馬光跟朋友在院子裡玩捉迷藏。院子裡有一個好大好大的水缸，裝滿了水。',
  '有一個小朋友爬上去玩，一不小心——撲通！掉進水缸裡了！',
  '大家都嚇壞了，有的哭，有的跑去叫大人。水缸太高，誰也拉不到他。',
  '司馬光沒有慌。他撿起一塊大石頭，用力往水缸砸過去——砰！',
  '水缸破了一個洞，水嘩啦啦流出來，掉下去的小朋友得救了！',
  '{name}，遇到事情先不要慌，停下來想一想，就會想到好辦法。不過要記得，危險的地方不可以自己去玩喔。'
 ]},
 {id:'s5',emoji:'🐯',title:'虎姑婆',paras:[
  '{name}，這是阿公小時候，大人講給阿公聽的故事，叫做「虎姑婆」。',
  '從前山腳下住著一對姊弟。有一天晚上，爸爸媽媽要出門，交代他們：「誰來敲門都不可以開喔。」',
  '半夜，叩、叩、叩，有人敲門：「我是你們的姑婆啦，快開門給我進去。」聲音沙沙啞啞的。',
  '弟弟一開門，進來一個包著頭巾的老婆婆。姊姊偷偷一看——咦？她的手怎麼毛茸茸的？原來是老虎變的虎姑婆！',
  '姊姊很聰明，說：「姑婆，我們要去上廁所。」就牽著弟弟偷偷溜出去，爬到門口的大樹上。',
  '虎姑婆追出來，在樹下轉來轉去。姊姊用力大喊：「阿爸阿母回來了！還帶了好多人！」',
  '虎姑婆嚇一大跳，夾著尾巴逃回山裡，再也不敢來了。',
  '{name}要記得：大人不在家，陌生人敲門不要開。遇到危險要想辦法，趕快找大人幫忙喔。'
 ]},
 {id:'s6',emoji:'🐜',title:'螞蟻與蚱蜢',paras:[
  '{name}，夏天的草地上，住著一群螞蟻，還有一隻蚱蜢。',
  '螞蟻每天排好隊搬食物，一粒米、一顆豆，慢慢搬回洞裡。',
  '蚱蜢在旁邊唱歌跳舞：「天氣這麼好，幹嘛那麼辛苦？來玩啦！」',
  '螞蟻說：「冬天來了就找不到東西吃，要先準備。」蚱蜢哈哈大笑，繼續玩。',

/* ========== 錄音 ========== */
var rec=null,stream=null,chunks=[],recMime='',recStart=0,recTimer=null,pending=null;
function pickMime(){
  if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return '';
  var c=['audio/mp4','audio/aac','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
  for(var i=0;i<c.length;i++){if(MediaRecorder.isTypeSupported(c[i]))return c[i];}
  return '';
}
function startRec(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('這支手機不支援錄音，請更新系統');return;}
  stopTTS();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(s){
    stream=s;var mt=pickMime();
    try{rec=mt?new MediaRecorder(s,{mimeType:mt}):new MediaRecorder(s);}catch(e){rec=new MediaRecorder(s);}
    recMime=(rec.mimeType||mt||'audio/mp4').split(';')[0];
    chunks=[];
    rec.addEventListener('dataavailable',function(e){if(e.data&&e.data.size)chunks.push(e.data);});
    rec.addEventListener('stop',onRecStop);
    rec.start(1000);
    recStart=Date.now();
    $('recBtn').className='on';$('recBtn').textContent='⏹ 停止';
    recTimer=setInterval(function(){$('recTime').textContent=mmss((Date.now()-recStart)/1000);},500);
  })['catch'](function(){toast('沒有麥克風權限，請到設定打開');});
}
function stopRec(){if(rec&&rec.state!=='inactive')rec.stop();}
function onRecStop(){
  clearInterval(recTimer);
  var dur=(Date.now()-recStart)/1000;
  try{stream.getTracks().forEach(function(t){t.stop();});}catch(e){}
  $('recBtn').className='';$('recBtn').textContent='🎙️ 錄音';$('recTime').textContent='00:00';
  if(dur<2||!chunks.length){toast('太短了，再講一次');return;}
  pending={blob:new Blob(chunks,{type:recMime}),dur:dur};
  var t=cur.free?'阿公小時候的故事':cur.title;
  $('saveTitle').value=t;
  $('saveInfo').textContent='錄了 '+mmss(dur);
  $('savePanel').className='';
}
$('recBtn').addEventListener('click',function(){if(rec&&rec.state==='recording')stopRec();else startRec();});

/* ========== IndexedDB（存 ArrayBuffer，iOS 較穩） ========== */
var db=null;
function idb(cb,fail){
  if(db)return cb(db);
  if(!window.indexedDB){toast('這支手機不能存錄音');fail&&fail();return;}
  var r=indexedDB.open('grandpa-story',2);
  r.onupgradeneeded=function(){var x=r.result;if(!x.objectStoreNames.contains('recs'))x.createObjectStore('recs',{keyPath:'id'});if(!x.objectStoreNames.contains('tts'))x.createObjectStore('tts',{keyPath:'k'});};
  r.onsuccess=function(){db=r.result;cb(db);};
  r.onerror=function(){toast('無法開啟儲存空間');fail&&fail();};
}
function recPut(o,ok,fail){idb(function(d){var tx=d.transaction('recs','readwrite');tx.objectStore('recs').put(o);tx.oncomplete=function(){ok&&ok();};tx.onerror=function(){toast('儲存失敗，手機空間可能不夠');fail&&fail();};},fail);}
function recAll(cb){idb(function(d){var out=[];var q=d.transaction('recs','readonly').objectStore('recs').openCursor();q.onsuccess=function(){var c=q.result;if(c){out.push(c.value);c['continue']();}else{out.sort(function(a,b){return b.date-a.date;});cb(out);}};q.onerror=function(){cb([]);};},function(){cb([]);});}
function recDel(id,cb){idb(function(d){var tx=d.transaction('recs','readwrite');tx.objectStore('recs')['delete'](id);tx.oncomplete=function(){cb&&cb();};});}

/* ========== 錄好的清單 ========== */
var RECS=[],playing=null,audio=null,audioUrl=null;
function renderRecs(){

         '<div class="acts"><button class="play" data-act="play">▶️ 播放</button><button class="share" data-act="share">傳 LINE</button><button class="del" data-act="del">🗑</button></div></div>';
    });
    $('recList').innerHTML=h;
  });
}
function getRec(id){for(var i=0;i<RECS.length;i++){if(RECS[i].id===id)return RECS[i];}return null;}
function extOf(t){return /mpeg|mp3/.test(t)?'.mp3':/mp4|aac|m4a/.test(t)?'.m4a':/webm/.test(t)?'.webm':/ogg/.test(t)?'.ogg':'.m4a';}
function stopPlay(){
  if(audio){try{audio.pause();}catch(e){}}
  if(audioUrl){try{URL.revokeObjectURL(audioUrl);}catch(e){}}
  audio=null;audioUrl=null;
  if(playing){var b=document.querySelector('.rec[data-id="'+playing+'"] .play');if(b){b.className='play';b.textContent='▶️ 播放';}}
  playing=null;
}
$('recList').addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('button'):null;if(!b)return;
  var card=b.closest('.rec');var id=card.getAttribute('data-id');var o=getRec(id);if(!o)return;
  var act=b.getAttribute('data-act');
  if(act==='play'){
    if(playing===id){stopPlay();return;}
    stopPlay();
    audioUrl=URL.createObjectURL(new Blob([o.buf],{type:o.type}));
    audio=new Audio(audioUrl);playing=id;
    b.className='play on';b.textContent='⏸ 暫停';
    audio.addEventListener('ended',stopPlay);
    var p=audio.play();if(p&&p['catch'])p['catch'](function(){stopPlay();toast('播放失敗');});
  }else if(act==='share'){
    var blob=new Blob([o.buf],{type:o.type});
    var fname=o.title.replace(/[\\\/:*?"<>|]/g,'')+extOf(o.type);
    var file=null;try{file=new File([blob],fname,{type:o.type});}catch(err){}
    var txt='阿公講故事給'+(S.name||'乖孫')+'聽 ❤️《'+o.title+'》';
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:o.title,text:txt})['catch'](function(){});
    }else{
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.parentNode.removeChild(a);},1500);
      toast('已下載，可以從檔案傳到 LINE');
    }
  }else if(act==='del'){
    if(b.className.indexOf('warn')<0){
      b.className='del warn';b.textContent='再按一次刪除';
      setTimeout(function(){if(b.parentNode){b.className='del';b.textContent='🗑';}},3000);
      return;
    }
    if(playing===id)stopPlay();
    recDel(id,function(){toast('刪掉了');renderRecs();});
  }
});

  if(i<0){pickedThemes.push(t);b.className='chip on';}else{pickedThemes.splice(i,1);b.className='chip';}
});
function extractText(d){
  if(d==null)return '';
  if(typeof d==='string')return d;
  if(d.content&&d.content.length){var s='';for(var i=0;i<d.content.length;i++){if(d.content[i].text)s+=d.content[i].text;}if(s)return s;}
  if(d.candidates&&d.candidates[0]&&d.candidates[0].content){try{return d.candidates[0].content.parts.map(function(p){return p.text||'';}).join('');}catch(e){}}
  if(d.text)return d.text;
  if(d.result)return extractText(d.result);
  if(d.data)return extractText(d.data);
  return JSON.stringify(d);
}
$('aiGo').addEventListener('click',function(){
  var btn=this;
  if(!S.api){toast('請先到設定填 AI 網址');return;}
  var n=parseInt($('aiLen').value,10)||8;
  var themes=pickedThemes.length?pickedThemes.join('、'):'溫馨有趣';
  var extra=$('aiExtra').value.trim();
  var prompt='請用台灣阿公講故事給孫子聽的口吻，寫一個適合「念出來」的原創兒童故事。\n'+
    '孫子約 '+(S.age||5)+' 歲。主題：'+themes+'。'+(extra?'\n補充：'+extra:'')+'\n'+
    '要求：\n- 繁體中文、台灣日常用語，句子短、口語、溫暖有趣，多用狀聲詞。\n'+
    '- 提到孫子的名字時一律寫成 {name}（大括號原樣保留），全篇大約叫 2～3 次，例如「{name}你猜怎麼了？」。\n'+
    '- 共 '+n+' 段，每段 2～4 句，最後一段溫柔帶出一個簡單的道理。\n'+
    '- 不要恐怖、暴力的情節。\n'+
    '只回傳 JSON，不要任何其他文字：{"title":"故事名","emoji":"一個表情符號","paras":["第一段","第二段"]}';
  btn.disabled=true;
  $('aiOut').innerHTML='<div class="loading"><div class="em">👴</div><br>阿公正在想故事…</div>';
  fetch(S.api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:3000,messages:[{role:'user',content:prompt}]})})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(d){
    var txt=extractText(d);var m=txt.match(/\{[\s\S]*\}/);if(!m)throw new Error('格式不對');
    var j=JSON.parse(m[0]);
    if(!j.paras||!j.paras.length)throw new Error('沒有內容');
    var s={id:'c'+Date.now(),custom:true,emoji:j.emoji||'✨',title:j.title||'阿公的新故事',paras:j.paras.map(function(p){return String(p);})};
    CUSTOM.unshift(s);saveJSON('gs_custom',CUSTOM);
    btn.disabled=false;
    $('aiOut').innerHTML='<div class="preview" style="margin-top:16px"><div style="font-size:40px;text-align:center">'+esc(s.emoji)+'</div><div style="text-align:center;font-weight:700;font-size:22px">'+esc(s.title)+'</div><div style="margin:10px 0;color:#7a5a3c">'+esc(nm(s.paras[0]))+'…</div><button class="btn" id="aiOpen">📖 開始講這個故事</button></div>';
    $('aiOpen').addEventListener('click',function(){openStory(s);});
  })['catch'](function(err){
    btn.disabled=false;
    $('aiOut').innerHTML='<div class="empty" style="padding:20px">😅 編不出來（'+esc(err.message||'連線失敗')+'）<br>等一下再試，或先講故事書裡的</div>';
  });
});

/* ========== 🤖 阿公的 AI 聲音（CosyVoice，經 arcar /voice） ========== */
var SAMPLE_TEXT='{name}，阿公來講故事給你聽喔。從前從前，在一個小小的村子裡，住著一隻愛唱歌的小黃狗。牠每天早上一起床，就跑到田邊汪汪叫，叫大家起來吃早餐。你說，這隻小狗是不是很可愛呀？';
var V=loadJSON('gs_voice',null);   /* {id, status, date} */
function voiceReady(){return !!(V&&V.id&&V.status==='OK');}
function vBase(){return String(S.voiceApi||'').replace(/\/+$/,'');}
function vPost(path,body,asAudio){
  var payload={},k;for(k in body){if(body.hasOwnProperty(k))payload[k]=body[k];}
  if(S.voiceToken)payload.token=S.voiceToken;
  return fetch(vBase()+'/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
  ['catch'](function(e){throw new Error('連不到聲音服務（'+(e&&e.message||'網路錯誤')+'）。請確認 arcar 已部署 /voice 路由');})
  .then(function(r){
    if(!r.ok){return r.json().then(function(j){throw new Error(j.error||('HTTP '+r.status));},function(){throw new Error('HTTP '+r.status);});}
    return asAudio?r.arrayBuffer():r.json();
  });
}
/* 合成快取：同一個聲音 + 同一段文字只花一次錢 */
function ttsGet(k,cb){idb(function(d){try{var q=d.transaction('tts','readonly').objectStore('tts').get(k);q.onsuccess=function(){cb(q.result?q.result.buf:null);};q.onerror=function(){cb(null);};}catch(e){cb(null);}},function(){cb(null);});}
function ttsPut(k,buf){idb(function(d){try{d.transaction('tts','readwrite').objectStore('tts').put({k:k,buf:buf});}catch(e){}});}
function aiSay(text,cb){
  var k=V.id+'|'+text;
  ttsGet(k,function(hit){
    if(hit)return cb(null,hit);
    vPost('tts',{voice_id:V.id,text:text},true).then(function(buf){ttsPut(k,buf);cb(null,buf);})['catch'](function(e){cb(e);});
  });
}
/* iOS 只允許「手指按下去」時開始播放。做法：按鈕被按的當下，先用同一個 Audio 元素播一段無聲音檔「解鎖」，
   之後 AI 合成好了再換 src 播放，iOS 就會放行。 */
var sayAudio=new Audio(),sayUrl=null;
var SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
function unlockAudio(){
  try{
    if(sayUrl){URL.revokeObjectURL(sayUrl);sayUrl=null;}
    sayAudio.src=SILENT;
    var p=sayAudio.play();if(p&&p['catch'])p['catch'](function(){});
  }catch(e){}
}
function stopSay(){
  try{sayAudio.pause();}catch(e){}
  if(sayUrl){try{URL.revokeObjectURL(sayUrl);}catch(e){}}
  sayUrl=null;
}
function playBuf(buf,type,onFail){
  stopSay();
  sayUrl=URL.createObjectURL(new Blob([buf],{type:type||'audio/mpeg'}));
  sayAudio.src=sayUrl;
  var p=sayAudio.play();
  if(p&&p['catch'])p['catch'](function(){if(onFail)onFail();else toast('播放失敗，再按一次');});
}
/* 試聽 AI 阿公的聲音（設定頁、錄樣本面板共用） */
var TEST_TEXT='{name}，你聽，這是阿公的聲音喔！今天晚上阿公再講一個故事給你聽。';
function testVoice(btn,show){
  if(!voiceReady()){show('還沒有 AI 聲音，請先錄樣本');return;}
  if(btn.disabled)return;
  unlockAudio();
  var label=btn.textContent;btn.disabled=true;btn.textContent='⏳ 阿公準備中…';
  aiSay(nm(TEST_TEXT),function(err,buf){
    btn.disabled=false;btn.textContent=label;
    if(err){show('😅 AI 聲音失敗：'+err.message);return;}
    playBuf(buf,'audio/mpeg');
  });
}
function sayPara(){
  var btn=$('ttsBtn');if(btn.disabled)return;
  unlockAudio();
  btn.disabled=true;btn.textContent='⏳';
  aiSay(nm(cur.paras[pIdx]),function(err,buf){
    btn.disabled=false;btn.textContent='🔊';
    if(err){toast('AI 聲音失敗：'+err.message);return;}
    playBuf(buf,'audio/mpeg');
  });
}
/* 整篇用阿公聲音做成一段錄音 */
var aiBusy=false;
$('aiVoiceBtn').addEventListener('click',function(){
  if(aiBusy||!cur||cur.free)return;
  if(rec&&rec.state==='recording'){toast('錄音中先不要用喔');return;}
  aiBusy=true;stopTTS();
  var btn=this,story=cur,texts=story.paras.map(function(p){return nm(p);}),bufs=[],i=0;
  function next(){
    if(i>=texts.length)return done();
    btn.textContent='⏳ '+(i+1)+'/'+texts.length;
    aiSay(texts[i],function(err,buf){
      if(err){aiBusy=false;btn.textContent='🤖 整篇';toast('第 '+(i+1)+' 段失敗：'+err.message);return;}
      bufs.push(buf);i++;next();
    });
  }
  function done(){
    var blob=new Blob(bufs,{type:'audio/mpeg'});
    var chars=texts.join('').length;
    var fr=new FileReader();
    fr.onload=function(){
      var o={id:String(Date.now()),title:story.title,emoji:story.emoji||'📖',date:Date.now(),dur:chars*0.27,type:'audio/mpeg',buf:fr.result,ai:true};
      /* 試著讀真正的長度，讀不到就用估計值 */
      var u=URL.createObjectURL(blob),a=new Audio(),fin=false;
      function save(){if(fin)return;fin=true;try{URL.revokeObjectURL(u);}catch(e){}
        recPut(o,function(){aiBusy=false;btn.textContent='🤖 整篇';toast('做好了！到「錄好的」聽阿公的 AI 聲音 🤖');});}
      a.addEventListener('loadedmetadata',function(){if(isFinite(a.duration)&&a.duration>0)o.dur=a.duration;save();});
      a.addEventListener('error',save);
      setTimeout(save,3000);
      a.preload='metadata';a.src=u;
    };
    fr.onerror=function(){aiBusy=false;btn.textContent='🤖 整篇';toast('存檔失敗');};
    fr.readAsArrayBuffer(blob);
  }
  next();
});

/* 錄聲音樣本 → 轉 16-bit 單聲道 WAV → 上傳建立聲音 */
function wStr(dv,o,s){for(var i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));}
function blobToWav(blob,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return cb(new Error('這支手機不能處理音檔'));
    var ac=new AC();
    ac.decodeAudioData(fr.result,function(ab){
      var c0=ab.getChannelData(0),c1=ab.numberOfChannels>1?ab.getChannelData(1):null,len=c0.length,sr=ab.sampleRate,i,v,peak=0;
      for(i=0;i<len;i++){v=Math.abs(c1?(c0[i]+c1[i])/2:c0[i]);if(v>peak)peak=v;}
      var gain=peak>0.01&&peak<0.7?0.9/peak:1;   /* 太小聲就放大一點 */
      var out=new ArrayBuffer(44+len*2),dv=new DataView(out);
      wStr(dv,0,'RIFF');dv.setUint32(4,36+len*2,true);wStr(dv,8,'WAVE');wStr(dv,12,'fmt ');
      dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);
      dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);wStr(dv,36,'data');dv.setUint32(40,len*2,true);
      for(i=0;i<len;i++){v=(c1?(c0[i]+c1[i])/2:c0[i])*gain;v=v>1?1:(v<-1?-1:v);dv.setInt16(44+i*2,v<0?v*0x8000:v*0x7FFF,true);}
      try{ac.close();}catch(e){}
      var r2=new FileReader();
      r2.onload=function(){cb(null,r2.result,ab.duration);};
      r2.onerror=function(){cb(new Error('轉檔失敗'));};
      r2.readAsDataURL(new Blob([out],{type:'audio/wav'}));
    },function(){try{ac.close();}catch(e){}cb(new Error('音檔解碼失敗'));});
  };
  fr.onerror=function(){cb(new Error('讀檔失敗'));};
  fr.readAsArrayBuffer(blob);
}
var vRec=null,vStream=null,vChunks=[],vStart=0,vTimer=null,vBlob=null,vDur=0,vMime='';
function vMsg(t){$('vMsg').textContent=t||'';}
function openVoicePanel(){
  if(!vBase()){toast('先填「聲音服務網址」');return;}
  $('vScript').textContent=nm(SAMPLE_TEXT);
  vBlob=null;$('vAfter').className='hidden';$('vTest').className=voiceReady()?'btn':'btn hidden';vMsg('');$('vTime').textContent='00:00';
  $('vRec').disabled=false;$('vRec').textContent='🎙️ 開始錄';
  $('voicePanel').className='';
}
function closeVoicePanel(){
  if(vRec&&vRec.state==='recording')vRec.stop();
  stopSay();$('voicePanel').className='hidden';
}
$('vSetup').addEventListener('click',openVoicePanel);
$('vClose').addEventListener('click',closeVoicePanel);
$('vRec').addEventListener('click',function(){
  if(vRec&&vRec.state==='recording'){vRec.stop();return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('這支手機不支援錄音');return;}
  stopSay();
  /* 樣本要原音，關掉降噪避免聲音變悶 */
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}}).then(function(s){
    vStream=s;var mt=pickMime();
    try{vRec=mt?new MediaRecorder(s,{mimeType:mt}):new MediaRecorder(s);}catch(e){vRec=new MediaRecorder(s);}
    vMime=(vRec.mimeType||mt||'audio/mp4').split(';')[0];vChunks=[];
    vRec.addEventListener('dataavailable',function(e){if(e.data&&e.data.size)vChunks.push(e.data);});
    vRec.addEventListener('stop',function(){
      clearInterval(vTimer);vDur=(Date.now()-vStart)/1000;
      try{vStream.getTracks().forEach(function(t){t.stop();});}catch(e){}
      $('vRec').className='btn';$('vRec').textContent='🎙️ 重錄一次';
      if(vDur<8||!vChunks.length){vMsg('太短了（'+Math.round(vDur)+' 秒），請把整段念完，大約 15～20 秒');return;}
      vBlob=new Blob(vChunks,{type:vMime});
      $('vAfter').className='';vMsg('錄了 '+Math.round(vDur)+' 秒。先聽聽看，清楚的話按「就用這段」。');
    });
    vRec.start(1000);vStart=Date.now();
    $('vRec').className='btn on';$('vRec').textContent='⏹ 念完了';$('vAfter').className='hidden';vMsg('慢慢念，不用急～');
    vTimer=setInterval(function(){var t=(Date.now()-vStart)/1000;$('vTime').textContent=mmss(t);if(t>=58&&vRec.state==='recording')vRec.stop();},500);
  })['catch'](function(){toast('沒有麥克風權限，請到設定打開');});
});
$('vPlay').addEventListener('click',function(){if(vBlob)playBuf(vBlob,vMime);});
$('vUpload').addEventListener('click',function(){
  if(!vBlob)return;var btn=this;btn.disabled=true;$('vRec').disabled=true;
  unlockAudio();$('vTest').className='btn hidden';
  vMsg('整理聲音中…');
  blobToWav(vBlob,function(err,dataUrl){
    if(err){btn.disabled=false;$('vRec').disabled=false;vMsg('😅 '+err.message);return;}
    vMsg('上傳中，AI 正在學阿公的聲音…');
    var old=V&&V.id;
    vPost('clone',{audio:dataUrl,prefix:'agong'}).then(function(d){
      V={id:d.voice_id,status:'DEPLOYING',date:Date.now()};saveJSON('gs_voice',V);updVoiceUI();
      if(old&&old!==d.voice_id)vPost('delete',{voice_id:old})['catch'](function(){});
      pollVoice(function(ok,msg){
        btn.disabled=false;$('vRec').disabled=false;
        if(!ok){vMsg('😅 '+msg);return;}
        vMsg('✅ 做好了！按下面「🔊 聽 AI 阿公說話」聽聽看像不像～');
        $('vTest').className='btn';
        aiSay(nm(TEST_TEXT),function(e2,buf){if(!e2)playBuf(buf,'audio/mpeg',function(){});});
      });
    })['catch'](function(e){btn.disabled=false;$('vRec').disabled=false;vMsg('😅 建立失敗：'+e.message);});
  });
});
var polling=false;
function pollVoice(cb){
  if(polling||!V||!V.id){cb&&cb(false,'沒有聲音');return;}
  polling=true;var n=0;
  (function tick(){
    vPost('status',{voice_id:V.id}).then(function(d){
      if(d.status==='OK'){polling=false;V.status='OK';saveJSON('gs_voice',V);updVoiceUI();cb&&cb(true);return;}
      if(d.status!=='DEPLOYING'){polling=false;V.status=d.status;saveJSON('gs_voice',V);updVoiceUI();cb&&cb(false,'樣本不能用（'+d.status+'），換個安靜的地方再錄一次');return;}
      if(++n>60){polling=false;cb&&cb(false,'等太久了，等一下回到設定頁再看看');return;}
      setTimeout(tick,2000);
    })['catch'](function(e){polling=false;cb&&cb(false,e.message);});
  })();
}
var vDelArm=false;
$('vDel').addEventListener('click',function(){
  var b=this;
  if(!vDelArm){vDelArm=true;b.textContent='再按一次刪除';setTimeout(function(){vDelArm=false;b.textContent='刪除 AI 聲音';},3000);return;}
  vDelArm=false;b.textContent='刪除 AI 聲音';
  var id=V&&V.id;V=null;saveJSON('gs_voice',null);updVoiceUI();toast('AI 聲音刪掉了');
  if(id)vPost('delete',{voice_id:id})['catch'](function(){});
});
$('vTest').addEventListener('click',function(){testVoice(this,vMsg);});
$('vTest2').addEventListener('click',function(){testVoice(this,toast);});
function updVoiceUI(){
  var st=$('vStat');
  $('vTest2').className=voiceReady()?'btn':'btn hidden';
  if(!V){st.textContent='還沒有設定。阿公念一段 20 秒的樣本，就能用阿公的聲音念新故事。';$('vSetup').textContent='🎙️ 錄聲音樣本';$('vDel').className='btn sec hidden';}
  else if(V.status==='OK'){st.textContent='✅ 已經可以用阿公的聲音念故事了';$('vSetup').textContent='🎙️ 重錄樣本';$('vDel').className='btn sec';}
  else if(V.status==='DEPLOYING'){st.textContent='⏳ AI 還在學阿公的聲音…';$('vSetup').textContent='🎙️ 重錄樣本';$('vDel').className='btn sec';}
  else{st.textContent='😅 上次的樣本不能用，請重錄';$('vSetup').textContent='🎙️ 重錄樣本';$('vDel').className='btn sec';}
}

/* ========== 設定 ========== */
function fillSet(){
  $('setName').value=S.name||'';$('setAge').value=S.age||5;$('setFont').value=S.font||30;$('setApi').value=S.api||'';$('setVoiceApi').value=S.voiceApi||'';$('setVoiceToken').value=S.voiceToken||'';
  updVoiceUI();if(V&&V.status==='DEPLOYING')pollVoice();
  $('fontPrev').style.fontSize=(S.font||30)+'px';
}
$('setFont').addEventListener('input',function(){$('fontPrev').style.fontSize=this.value+'px';});
$('setSave').addEventListener('click',function(){
  S.name=$('setName').value.trim()||'乖孫';
  S.age=parseInt($('setAge').value,10)||5;
  S.font=parseInt($('setFont').value,10)||30;
  S.api=$('setApi').value.trim();
  S.voiceApi=$('setVoiceApi').value.trim();
  S.voiceToken=$('setVoiceToken').value.trim();
  saveJSON('gs_set',S);updSub();toast('設定存好了');
});

/* ========== 啟動 ========== */
updSub();renderLib();
if(!loadJSON('gs_named',false)&&S.name==='乖孫'){
  saveJSON('gs_named',true);
  setTimeout(function(){toast('先到「設定」填孫子的名字吧！');},800);
}
})();
